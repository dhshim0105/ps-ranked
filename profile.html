<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 | PS 맞짱</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>PS 맞짱</h1>
            <nav>
                <a href="index.html">메인</a>
                <a href="match.html">매칭</a>
                <a href="ranking.html">랭킹</a>
                <a href="profile.html">프로필</a>
            </nav>
        </div>
    </header>
    <main>
        <section id="profile" class="main-section">
            <h2 class="page-title">내 프로필</h2>
            
            <div class="player-card">

                <p>닉네임: mastershim</p>

                <div class="profile-stats">

                    <div class="stat-card card">
                        <h3>티어</h3>
                        <p><span class="tier">Diamond 5</span></p>
                    </div>
                    <div class="stat-card card">
                        <h3>레이팅</h3> 
                        <p><span class="rating">1900</span></p>
                    </div>
                    <div class="stat-card card">
                        <h3>승률</h3>
                        <p>57.1%</p>
                    </div>
                    <div class="stat-card card">
                        <h3>총 경기 수</h3>
                        <p>42전 24승 18패</p>
                    </div>

                </div>

            </div>

            <div class="recent-match">
                <h3>최근 경기</h3>
                <article class="match-record">
                    <span>문제 #103</span>
                    <span>algorithmKing1</span>
                    <span class="win">WIN</span>
                    <span>+21</span>
                </article>
                <article class="match-record">
                    <span>문제 #207</span>
                    <span>algorithmKing2</span>
                    <span class="loss">LOSS</span>
                    <span>-18</span>
                </article>
                <article class="match-record">
                    <span>문제 #315</span>
                    <span>algorithmKing3</span>
                    <span class="win">WIN</span>
                    <span>+17</span>
                </article>
            </div>
        </section>
    </main>
    <script src="js/profile.js"></script>
</body>   
</html>
