<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 | PS 맞짱</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>PS 맞짱</h1>
            <nav>
                <a href="index.html">메인</a>
                <a href="match.html">매칭</a>
                <a href="ranking.html">랭킹</a>
                <a href="profile.html">프로필</a>
            </nav>
        </div>
    </header>
    <main>
        <section id="profile" class="main-section">
            <h2 class="page-title">내 프로필</h2>
            
            <div class="player-card">

                <span id="profile-username"></span>

                <div class="profile-stats">

                    <div class="stat-card card">
                        <h3>티어</h3>
                        <p><span id="profile-tier" class="tier">-</span></p>
                    </div>
                    <div class="stat-card card">
                        <h3>레이팅</h3> 
                        <p><span id="profile-rating" class="rating">-</span></p>
                    </div>
                    <div class="stat-card card">
                        <h3>승률</h3>
                        <p id="profile-win-rate"></p>
                    </div>
                    <div class="stat-card card">
                        <h3>총 경기 수</h3>
                        <p id="profile-record"></p>
                    </div>

                </div>

            </div>

            <div class="recent-match">
                <h3>최근 경기</h3>
                <div id="recent-match-list"></div>
            </div>
        </section>
    </main>
    <script src="js/profile.js"></script>
</body>   
</html>
