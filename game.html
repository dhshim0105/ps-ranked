<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 | PS 맞짱</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>PS 맞짱</h1>
            <nav>
                <a href="index.html">메인</a>
                <a href="match.html">매칭</a>
                <a href="ranking.html">랭킹</a>
                <a href="profile.html">프로필</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- id는 특정 요소 식별, class는 공통 그룹, span은 문장 안 일부를 묶는 태그 -->
        <section id="game" class="main-section">
            <h2 class="page-title">진행 중인 경기</h2>

            <div class="problem-info">
                <h3>더하기</h3>
                <p>문제 번호: 1</p>
                <p>난이도: <span class="tier">Bronze</span></p>
            </div>
            <div class="players">
                <article class="player">
                    <h3>player A</h3>
                    <p>Rating: 1234</p>
                </article>

                <p class="versus">VS</p>

                <article class="player">
                    <h3>player B</h3>
                    <p>Rating: 1221</p>
                </article>
            </div>

            
            <div class="timer">
                <p>경과 시간</p>
                <p>00:00</p>
            </div>

            <section class="submit-record">
                <h2>내 제출 기록</h2>
                
                <div class="submit-list">
                    <span>1차 제출</span>
                    <span id="submit-status" class="status status-wa">WA</span>

                    <span>2차 제출</span>
                    <span class="status status-tle">TLE</span>
                    
                    <span>3차 제출</span>
                    <span class="status status-ac">AC</span>
                </div>
            </section>

            <!-- 추후 이 위치에 문제 본문 추가 예정-->
        </section>

    </main>
    <script src="js/script.js"></script>
</body>     
</html>
