<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 | PS 맞짱</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>PS 맞짱</h1>
            <nav>
                <a href="index.html">메인</a>
                <a href="match.html">매칭</a>
                <a href="ranking.html">랭킹</a>
                <a href="profile.html">프로필</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- id는 특정 요소 식별, class는 공통 그룹, span은 문장 안 일부를 묶는 태그 -->
        <section id="game" class="main-section">
            <h2 class="page-title">진행 중인 경기</h2>

            <div class="problem-info">
                <h3>더하기</h3>
                <p>문제 번호: 1</p>
                <p>난이도: <span class="tier">Bronze</span></p>
            </div>
            <div class="players">
                <article class="player">
                    <h3 id="player-name"></h3>
                    <p id="player-rating"></p>
                </article>

                <p class="versus">VS</p>

                <article class="player">
                    <h3 id="opponent-name"></h3>
                    <p id="opponent-rating"></p>
                </article>
            </div>

            
            <div class="timer">
                <p>경과 시간</p>
                <p id="game-timer">00:00</p>
            </div>
            <p id="game-status">문제 푸는 중...</p>

            <section class="submit-record">
                <h2>내 제출 기록</h2>
                <div id="submission-list"></div>
            </section>

            <section id="problem" class="main-section">
                <h2 id="problem-title"></h2>
                
                <p>
                    난이도: <span id="problem-difficulty"></span>
                </p>

                <p id="problem-tags"></p>

                <h3>문제</h3>
                <p id="problem-description"></p>

                <h3>입력</h3>
                <p id="problem-input"></p>

                <h3>출력</h3>
                <p id="problem-output"></p>

                <h3>예제 입력</h3>
                <div id="examples-container"></div>

            </section>

            <button id="submit-answer" class="submit-btn">제출</button>
        </section>

    </main>
    <script src="js/game.js"></script>
</body>     
</html>
